default_category: Uncategorized
categories:
  - Groceries
  - Bills
  - Transport
  - Eating Out
  - Income
  - Transfers
keywords:
  Groceries: ["TESCO", "SAINSBURY", "ALDI", "LIDL", "WAITROSE"]
  Bills: ["UTILITIES", "BROADBAND", "WATER LTD", "COUNCIL TAX"]
  Transport: ["UBER", "TRAINLINE", "TFL", "BP STATION"]
  Eating Out: ["STARBUCKS", "MCDONALD", "PRET", "NANDO"]
  Income: ["PAYROLL", "SALARY", "ACME LTD"]
  Transfers: ["TRANSFER", "FROM SAVINGS", "TO SAVINGS"]
regex:
  Income: ["^PAYROLL.*", "SALARY [0-9]{4}-[0-9]{2}"]
amount_rules:
  Transfers:
    - { min: -0.01, max: -10000.0 }
