[project]
name = "budgeter"
version = "0.1.0"
description = "Multi-bank budgeting: ingest statements, auto-classify, and review on a timeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.8",
  "pyyaml>=6.0.1",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.5.5",
  "mypy>=1.11",
  "types-PyYAML>=6.0.12",
  "types-python-dateutil>=2.9.0.20240316",
]

[tool.uv]
# If you use uv, you can do: uv add -E ui streamlit
# This section exists to play nicely with uv but is optional.

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true
select = ["E","F","I","UP","B","C90"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
