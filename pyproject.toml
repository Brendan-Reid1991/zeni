[project]
name = "zeni"
version = "0.1.0"
description = "Multi-bank budgeting: ingest statements, auto-classify, and review on a timeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Brendan Reid" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.8",
  "pyyaml>=6.0.1",
  "python-dateutil>=2.9.0",
]

[dependency-groups]
interactive = ["streamlit>=1.36", "ipykernel"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.5.5",
  "mypy>=1.11",
  "types-PyYAML>=6.0.12",
  "types-python-dateutil>=2.9.0.20240316",
]

[tool.ruff]
line-length = 89
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "TCH", "RUF"]
ignore = []
exclude=["tests/*"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeni"]